# pc-tools (tools.jdg.dev) nginx vhost — mounted ro at /etc/nginx/conf.d/default.conf
# (replaces the image default). Server mechanics: vps-ops-recovery
# reports/20261012_tools_jdg_dev_deploy_plan.md
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind the central Caddy proxy: keep redirects relative so the
    # trailing-slash redirect preserves https + host + query.
    absolute_redirect off;
    port_in_redirect off;

    # Small files (index.html, app.js, catalog.json fallback): always revalidate (ETag → 304),
    # so a deploy shows up on the next reload.
    add_header Cache-Control "no-cache" always;

    # The page runs only its own script, reads the tool list from GitHub raw, and loads two web fonts.
    # Inline <style> stays allowed (no inline script). Update this list if the page gains a new origin.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://raw.githubusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok";
    }
}
